# The production shape: the connection string in a secret the chart never sees,
# under a key of your choosing, so no Secret object is rendered at all.
database:
  existingSecret: cmdb-db
  existingSecretKey: postgres
auth:
  tenantId: "00000000-0000-0000-0000-000000000000"
  clientId: "55555555-5555-5555-5555-555555555555"
aep:
  apiUrl: "http://estate-azure-estate-portal-api.estate.svc.cluster.local/"
  scope: "api://33333333-3333-3333-3333-333333333333/.default"
ingress:
  className: nginx
  host: estate.ci.example
worker:
  workloadIdentity:
    clientId: "66666666-6666-6666-6666-666666666666"
  serviceAccount:
    annotations:
      example.com/owner: platform
