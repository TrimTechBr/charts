{{- include "cmdb.validate" . -}}
{{/*
  One ServiceAccount per Deployment. Only the worker's carries an Azure identity:
  it is the one process that asks for a token (to call the portal). The API
  validates tokens and never obtains one, so an identity on its account would be a
  credential mounted where nothing uses it.
*/}}
{{- range $component := list "api" "worker" }}
{{- $sa := (index $.Values $component).serviceAccount }}
{{- if $sa.create }}
{{- /*
  Built as a dict and merged, rather than two blocks of YAML printed one after the
  other. Printing them would emit the same annotation key twice whenever someone
  sets a workload identity annotation by hand, and duplicate keys in a manifest are
  resolved by whichever parser reads it rather than by anyone's intent.
*/}}
{{- $chart := dict }}
{{- if and (eq $component "worker") $.Values.worker.workloadIdentity.enabled }}
{{- $_ := set $chart "azure.workload.identity/client-id" ($.Values.worker.workloadIdentity.clientId | toString) }}
{{- $_ := set $chart "azure.workload.identity/tenant-id" ($.Values.auth.tenantId | toString) }}
{{- end }}
{{- $annotations := merge (deepCopy ($sa.annotations | default dict)) $chart }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cmdb.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "cmdb.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
