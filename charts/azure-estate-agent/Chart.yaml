apiVersion: v2
name: azure-estate-agent
description: Reports Kubernetes workloads from inside an AKS cluster to an Azure Estate Portal. Outbound only — the portal never connects to the cluster.
type: application

version: 0.1.3
appVersion: "0.7.2"

home: https://github.com/TrimTechBr/charts
sources:
  - https://github.com/TrimTechBr/charts
keywords:
  - azure
  - aks
  - kubernetes
  - inventory
  - agent

maintainers:
  - name: TrimTechBR
    url: https://github.com/TrimTechBr

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: k8s-agent
      image: ghcr.io/trimtechbr/azure-estate/k8s-agent:0.7.2
  artifacthub.io/links: |
    - name: source
      url: https://github.com/TrimTechBr/charts
  artifacthub.io/changes: |
    - kind: fixed
      description: Agent 0.7.2, where a successful scan exits zero instead of being reported as a failed Job
    - kind: fixed
      description: runAsUser 10001 to match the fixed image, and a writable /tmp for a container whose root filesystem is read-only
    - kind: added
      description: First release of the chart, replacing the raw manifests under deploy/k8s-agent
    - kind: fixed
      description: 0.1.0 was published unsigned because cosign could not authenticate to the registry; use this version
