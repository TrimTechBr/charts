# Azure Estate Portal
#
# Three components on one hostname: the web UI at "/", the API at "/api". They
# share a hostname on purpose -- the browser then never makes a cross-origin
# request, so there is no CORS configuration to get wrong.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  # The three images are <repository>/api, <repository>/worker and <repository>/webapp.
  repository: trimtechbr/azure-estate
  # Empty means the chart's appVersion, so the chart and the product it installs
  # cannot drift by accident.
  tag: ""
  pullPolicy: IfNotPresent
  # Needed while the packages are private. Create the secret first, e.g.
  #   kubectl create secret docker-registry ghcr --docker-server=ghcr.io \
  #     --docker-username=<user> --docker-password=<PAT with read:packages>
  pullSecrets: []
  # - name: ghcr

# -- Database ----------------------------------------------------------------
# PostgreSQL is required. The API and the worker are separate deployments that
# both write, so a file database would need shared writable storage and would
# corrupt under two writers.
database:
  # Preferred: a secret you manage, so the connection string never passes through
  # `helm get values` or the release secret.
  existingSecret: ""
  existingSecretKey: connectionString

  # Convenience for a first install. The value lands in a chart-managed Secret and
  # is readable with `helm get values`, so prefer existingSecret in production.
  connectionString: ""

# -- Ingress -----------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  annotations: {}
  host: estate.example.com

  # Everything the API serves. "/api" covers the REST surface; add "/health" to
  # probe from outside the cluster. There is no "/swagger" to add: the API
  # explorer exists only in Development.
  apiPaths:
    - /api

  tls:
    enabled: false
    # Empty with tls.enabled uses the ingress controller's default certificate.
    secretName: ""

# -- Gateway API -------------------------------------------------------------
# The same routing as the ingress above, expressed as an HTTPRoute. Off by default
# because it needs the Gateway API CRDs installed and a Gateway to attach to, and a
# cluster without them would fail the install rather than skip the object.
#
# Both can be on at once, deliberately: migrating from Ingress to Gateway API means
# running the two side by side while DNS moves, and a chart that forced the choice
# would make the safe migration the one you cannot express.
httpRoute:
  enabled: false
  annotations: {}

  # The Gateway to attach to. Usually owned by whoever runs the cluster's edge and
  # living in its own namespace -- which then needs a ReferenceGrant on that side,
  # allowing this namespace to attach. The chart cannot create that grant, and an
  # HTTPRoute without one is accepted and never programmed: it reads as a routing
  # bug and is a permission.
  parentRefs:
    - name: ""
      namespace: ""
      # The listener to attach to, when the Gateway has more than one. Empty attaches
      # to every listener whose hostname and protocol allow it.
      sectionName: ""
      port: null

  hostnames:
    - estate.example.com

  # Same split as the ingress: everything under these goes to the API, the rest to
  # the UI. Gateway API matches longest prefix, so "/api" wins over "/" on its own.
  apiPaths:
    - /api

  # Whether the Gateway terminates TLS for these hostnames. The chart does not
  # configure that -- it belongs to the Gateway's listener -- but the UI needs to know
  # the scheme to build the URL it calls itself on.
  tls: true

# -- Components --------------------------------------------------------------
api:
  # The floor when the autoscaler is off. minReplicas below is the floor when it
  # is on -- this value is then ignored, and the Deployment omits the field so
  # that a helm upgrade does not write it back over the autoscaler's decision.
  replicaCount: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    # Off by default, and think before turning it on: the .NET GC grows the heap
    # toward the limit and does not hand it back, so memory reads as permanently
    # high and the autoscaler ratchets up and never comes down.
    targetMemoryUtilizationPercentage: ""

  # Who may call the API. Every endpoint except /health and the three agent
  # endpoints needs an Entra ID token carrying one of the app roles AEP.Reader,
  # AEP.Admin or AEP.AddOn. Both ids are required: outside Development the API
  # refuses to start without them, so the chart refuses to render without them
  # rather than install a pod that crash-loops. There is no setting that turns
  # authentication off.
  auth:
    # The tenant that issues the tokens. -> AzureAd__TenantId
    tenantId: ""
    # Application (client) id of the app registration that exposes the API, with
    # Application ID URI api://<clientId> and the scope access_as_user.
    # -> AzureAd__ClientId
    clientId: ""
    # An extra accepted audience, for a custom Application ID URI. The client id and
    # api://<clientId> are always accepted. -> AzureAd__Audience, only when set.
    audience: ""

  # Bounds voluntary disruption only -- a node drain, a cluster upgrade, the node
  # autoscaler compacting nodes. Nothing here helps when a node simply dies; that
  # is what having replicas is for.
  pdb:
    enabled: true
    # One pod out at a time. Preferred over minAvailable while an autoscaler is in
    # play: minAvailable is a floor, so at 6 replicas "minAvailable: 1" would let a
    # drain take five pods at once.
    maxUnavailable: 1
    # A floor instead of a step, if you would rather. Accepts a percentage ("50%").
    # Wins over maxUnavailable when both are set, because the API rejects an object
    # carrying both.
    minAvailable: ""
  # Its own account, named <release>-azure-estate-portal-api. There is no name
  # override: the name has to match the federated credential's subject, and a
  # rename is a change on the Azure side too, not a value to flip here.
  serviceAccount:
    create: true
    # Merged over what the chart writes, so an annotation set here wins. That is how
    # a component gets its own managed identity: set
    # azure.workload.identity/client-id here and it overrides azure.workloadIdentity.clientId
    # for this account alone.
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

worker:
  # No replicaCount, no autoscaling and no pdb block, on purpose. The worker claims sync
  # runs from a queue in the database, so a second replica races the first for the
  # same run and collects the same estate twice. One is the only working answer,
  # the Deployment hardcodes it, and a setting that accepts a single value is not
  # a setting.

  # Azure identity, here rather than at the top level because the worker is the
  # only component that talks to Azure. The API reads the database and nothing
  # else -- it does not even reference the project that speaks ARM.
  #
  # Needs Reader and Monitoring Reader on the subscriptions or management groups
  # in scope, and AcrPull per registry to inventory container images.
  azure:
    # Outside the two blocks below, and not inside workloadIdentity, because it
    # belongs to the credential rather than to either way of obtaining one. Every
    # collector passes it to DefaultAzureCredentialOptions.TenantId: it becomes the
    # tenant-id annotation under workload identity, AZURE_TENANT_ID under a client
    # secret, and with neither enabled it is the only thing disambiguating whatever
    # identity DefaultAzureCredential finds on its own.
    #
    # clientId is inside each block for the opposite reason: those are different
    # identities -- a managed identity in one case, an app registration in the other.
    tenantId: ""
    # On AKS with the OIDC issuer enabled. Nothing is stored: the token is projected
    # into the pod.
    workloadIdentity:
      enabled: true
      clientId: ""
    # For a cluster that is not AKS. DefaultAzureCredential reads these three
    # variables directly, so this needs no change in the application.
    clientSecret:
      enabled: false
      clientId: ""
      existingSecret: ""
      existingSecretKey: clientSecret
      # Same caveat as database.connectionString.
      value: ""

  # Its own account, named <release>-azure-estate-portal-worker. There is no name
  # override: the name has to match the federated credential's subject, and a
  # rename is a change on the Azure side too, not a value to flip here.
  serviceAccount:
    create: true
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

webapp:
  replicaCount: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""

  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  # Its own account, named <release>-azure-estate-portal-webapp. There is no name
  # override: the name has to match the federated credential's subject, and a
  # rename is a change on the Azure side too, not a value to flip here.
  serviceAccount:
    create: true
    annotations: {}

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

  # What the browser calls. Empty derives it from ingress.host, which is right
  # whenever the UI and the API share a hostname -- set it only when they do not.
  apiBaseUrl: ""

  # Sign-in for the UI (MSAL, browser-facing). Deliberately separate from the
  # worker.azure.* block above: that one is how the worker reads Azure, this one is
  # who may open the portal. They can be different tenants.
  #
  # Empty means the API's own registration (api.auth.*), which is the recommended
  # shape: one app registration serves both the SPA and the API. Set these only
  # when the SPA has a registration of its own.
  azureAd:
    tenantId: ""
    clientId: ""
    # The scope the SPA asks for when it calls the API. Empty derives
    # api://<api.auth.clientId>/access_as_user -- the API's, not the SPA's, since
    # the token is for the API. -> API_SCOPE
    apiScope: ""

# -- Add-ons -----------------------------------------------------------------
# Add-ons the UI loads at runtime, each from its own backend. Every entry needs an
# id (lower-case, ^[a-z][a-z0-9-]{1,31}$, unique) and the URL of its manifest.
# A relative URL is resolved against the portal's own origin, which is the normal
# case: the add-on chart publishes its backend on this same host under
# /addons/<id>/, so there is no CORS to configure. Its pages appear in the UI
# under /apps/<id>/ -- a different prefix on purpose, so reloading a deep link
# reaches the UI and not the add-on's API.
#
# Written into the UI as addons.json at container start, so a change restarts the
# web pods. -> ADDONS_JSON
addons: []
# - id: cmdb
#   manifestUrl: /addons/cmdb/manifest.json

# -- Application settings ----------------------------------------------------
config:
  # Workloads inside the AKS clusters, reported by the agent chart. Off unless an
  # agent is installed: without one, every cluster would be reported as silent.
  collectKubernetesWorkloads: false

  # Registry contents. Needs AcrPull per registry; registries without it are
  # reported as unread rather than empty.
  collectAcrDataPlane: true

  # Application Map edges -- who calls whom, from the dependency telemetry of each
  # Application Insights component. Reader is enough when the backing workspace
  # allows resource-context access (the default); a workspace that requires
  # workspace permissions answers 403 and needs Log Analytics Reader on it. A 403
  # is reported as a collection error and never fails the sync.
  # -> AppMap__Enabled
  collectApplicationMap: true

  # Subscriptions collected in parallel. Measured: 14 subscriptions went from
  # 50m to 17m at 3, with the heap at 147 MB.
  subscriptionConcurrency: 5

  # Anything else, mapped straight into the ConfigMap. Keys are ASP.NET
  # configuration paths, e.g. Metrics__WindowDays: "7".
  extra: {}

# All three pods. The uid is numeric because Kubernetes only reads the image config
# and cannot resolve a user name -- runAsNonRoot against an image whose USER is a
# name is refused at admission, not at runtime. It matches the uid baked into all
# three images, including the web one, whose nginx listens on 8080 and writes its
# pid to /tmp so it needs no privilege to start.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
