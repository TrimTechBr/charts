{{/*
  One ServiceAccount per Deployment, configured from that component's own block.

  A federated credential is bound to a single namespace/serviceaccount subject, so
  a shared account means every component authenticates as the same Azure identity
  and none of them can be revoked without the others. Separate accounts also let
  the UI have no Azure identity at all, which is right: it is a static bundle
  served by nginx and never calls Azure.
*/}}
{{- range $component := list "api" "worker" "webapp" }}
{{- $sa := (index $.Values $component).serviceAccount }}
{{- if $sa.create }}
{{- /*
  Built as a dict and merged, rather than two blocks of YAML printed one after the
  other. Printing them would emit the same annotation key twice whenever someone
  sets a workload identity annotation by hand, and duplicate keys in a manifest are
  resolved by whichever parser reads it rather than by anyone's intent. Merging
  also means a per-component client-id simply overrides the shared one.
*/}}
{{- $chart := dict }}
{{- if and $.Values.worker.azure.workloadIdentity.enabled (eq $component "worker") }}
{{- $_ := set $chart "azure.workload.identity/client-id" ($.Values.worker.azure.workloadIdentity.clientId | toString) }}
{{- /*
  Omitted when unset rather than emitted empty: without it the webhook falls back
  to the tenant the cluster's workload identity add-on was installed with, which is
  right until the identity lives in a different tenant.
*/}}
{{- with $.Values.worker.azure.tenantId }}
{{- $_ := set $chart "azure.workload.identity/tenant-id" (. | toString) }}
{{- end }}
{{- end }}
{{- $annotations := merge (deepCopy ($sa.annotations | default dict)) $chart }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "estate.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "estate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
