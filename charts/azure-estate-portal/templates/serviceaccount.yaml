{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "estate.serviceAccountName" . }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
  annotations:
    {{- /*
      The federated credential on the managed identity has to name this cluster's
      OIDC issuer and this namespace/serviceaccount pair, or the token exchange
      fails with a message that does not say which half is wrong.
    */ -}}
    {{- if .Values.azure.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ .Values.azure.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
