{{/*
  One ServiceAccount per Deployment, rather than one shared by all three.

  A federated credential is bound to a single namespace/serviceaccount subject, so
  a shared account means every component authenticates as the same Azure identity
  and none of them can be revoked without the others. Separate accounts also let
  the UI have no Azure identity at all, which is right: it is a static bundle
  served by nginx and never calls Azure.
*/}}
{{- if .Values.serviceAccount.create }}
{{- range $component := list "api" "worker" "webapp" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "estate.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "estate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  annotations:
    {{- /*
      Only the components that read Azure. The federated credential on the managed
      identity has to name this cluster's OIDC issuer and this namespace/account
      pair, or the exchange fails with a message that does not say which half is
      wrong.
    */ -}}
    {{- if and $.Values.azure.workloadIdentity.enabled (has $component (list "api" "worker")) }}
    azure.workload.identity/client-id: {{ $.Values.azure.workloadIdentity.clientId | quote }}
    {{- /*
      Omitted when unset rather than emitted empty: without it the webhook falls
      back to the tenant the cluster's workload identity add-on was installed with,
      which is right until the identity lives in a different tenant.
    */ -}}
    {{- with $.Values.azure.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with $.Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
