{{- /*
Only created when a value was given inline. Pointing at an existing secret is the
preferred path, and then the chart never holds the value at all.
*/ -}}
{{- if and (not .Values.database.existingSecret) .Values.database.connectionString }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "estate.fullname" .) }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
type: Opaque
stringData:
  connectionString: {{ .Values.database.connectionString | quote }}
{{- end }}
---
{{- if and .Values.azure.clientSecret.enabled (not .Values.azure.clientSecret.existingSecret) .Values.azure.clientSecret.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-azure" (include "estate.fullname" .) }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.azure.clientSecret.value | quote }}
{{- end }}
