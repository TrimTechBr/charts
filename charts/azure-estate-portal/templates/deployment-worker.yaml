apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-worker" (include "estate.fullname" .) }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  {{- /*
    Recreate, not RollingUpdate. A sync run is claimed from a database queue and
    takes tens of minutes; two workers alive at once during a rollout would both
    hold a claim on the estate.
  */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "estate.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "estate.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- include "estate.backendPodLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "estate.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "estate.image" (dict "root" . "component" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "estate.fullname" . }}
          env:
            {{- include "estate.backendEnv" . | nindent 12 }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            The worker serves no HTTP. It touches a heartbeat file as it works, so
            liveness is "the file is younger than two minutes" -- which stays true
            through a long collection and goes false if the loop wedges.
          */}}
          livenessProbe:
            exec:
              command: ["find", "/tmp/worker.healthy", "-mmin", "-2"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
