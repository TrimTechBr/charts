apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-api" (include "estate.fullname" .) }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "estate.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-webapp" (include "estate.fullname" .) }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
spec:
  type: ClusterIP
  selector:
    {{- include "estate.componentSelectorLabels" (dict "root" . "component" "webapp") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
