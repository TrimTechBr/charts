{{- include "estate.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "estate.fullname" . }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
data:
  Database__Provider: "PostgreSQL"
  Azure__TenantId: {{ .Values.azure.tenantId | quote }}
  Kubernetes__CollectWorkloads: {{ .Values.config.collectKubernetesWorkloads | quote }}
  Acr__CollectDataPlane: {{ .Values.config.collectAcrDataPlane | quote }}
  Sync__SubscriptionConcurrency: {{ .Values.config.subscriptionConcurrency | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
