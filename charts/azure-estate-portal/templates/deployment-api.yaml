apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-api" (include "estate.fullname" .) }}
  labels:
    {{- include "estate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- /*
    Omitted while the HPA owns it. A replicas field here is written back on every
    helm upgrade, which would undo the autoscaler's decision and scale the pods
    down mid-traffic on a change that had nothing to do with capacity.
  */}}
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "estate.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "estate.componentSelectorLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- include "estate.backendPodLabels" . | nindent 8 }}
      annotations:
        {{- /*
          Restarts the pods when the settings change. Without it a helm upgrade
          that only touches the ConfigMap changes nothing a running pod reads.
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "estate.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "estate.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "estate.fullname" . }}
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            {{- include "estate.backendEnv" . | nindent 12 }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            The API creates and migrates the schema on boot, which on a large
            database takes longer than a liveness probe would wait. The startup
            probe is what keeps that from being read as a hung process.
          */}}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
