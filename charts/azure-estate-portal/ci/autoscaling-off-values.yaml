# The same as default-values.yaml with the autoscalers off, so the Deployments
# carry a replica count again and no HorizontalPodAutoscaler is rendered.
#
database:
  connectionString: "Host=postgres;Database=estate;Username=estate;Password=ci-only"
ingress:
  host: estate.ci.example
  tls:
    enabled: true
image:
  pullSecrets:
    - name: ghcr
api:
  autoscaling:
    enabled: false
  auth:
    tenantId: "00000000-0000-0000-0000-000000000000"
    clientId: "33333333-3333-3333-3333-333333333333"
webapp:
  autoscaling:
    enabled: false

worker:
  azure:
    tenantId: "00000000-0000-0000-0000-000000000000"
    workloadIdentity:
      clientId: "11111111-1111-1111-1111-111111111111"