# The path for a cluster that is not AKS: DefaultAzureCredential reads the three
# AZURE_* variables directly.
database:
  existingSecret: estate-db
ingress:
  host: estate.ci.example

worker:
  azure:
    tenantId: "00000000-0000-0000-0000-000000000000"
    workloadIdentity:
      enabled: false
    clientSecret:
      enabled: true
      clientId: "22222222-2222-2222-2222-222222222222"
      existingSecret: estate-azure