# What CI renders and validates. Not an example to copy: the connection string is
# inline here because a pipeline has no secret to point at, and a real install
# should use database.existingSecret.
database:
  connectionString: "Host=postgres;Database=estate;Username=estate;Password=ci-only"
ingress:
  host: estate.ci.example
  tls:
    enabled: true
image:
  pullSecrets:
    - name: ghcr

worker:
  azure:
    tenantId: "00000000-0000-0000-0000-000000000000"
    workloadIdentity:
      clientId: "11111111-1111-1111-1111-111111111111"