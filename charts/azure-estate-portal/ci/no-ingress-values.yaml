# Someone else's gateway publishes the portal, so the chart publishes nothing and
# the browser-facing URL has to be stated.
database:
  existingSecret: estate-db
ingress:
  enabled: false
webapp:
  apiBaseUrl: https://estate.ci.example/
config:
  collectKubernetesWorkloads: true
  extra:
    Metrics__WindowDays: "14"

worker:
  azure:
    workloadIdentity:
      clientId: "11111111-1111-1111-1111-111111111111"
api:
  auth:
    tenantId: "00000000-0000-0000-0000-000000000000"
    clientId: "33333333-3333-3333-3333-333333333333"
