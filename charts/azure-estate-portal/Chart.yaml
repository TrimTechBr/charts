apiVersion: v2
name: azure-estate-portal
description: Discovery, analysis and observability reporting for Azure environments -- API, sync worker and web UI.
type: application

# The chart's own version, bumped for any change to the chart. appVersion tracks
# the product, which releases on its own cadence.
version: 0.2.2
appVersion: "0.8.1"

home: https://github.com/TrimTechBr/charts
sources:
  - https://github.com/TrimTechBr/charts
keywords:
  - azure
  - inventory
  - observability
  - governance
  - finops

maintainers:
  - name: TrimTechBR
    url: https://github.com/TrimTechBr

annotations:
  # Standard chart metadata. Also what a chart index would read if this repository
  # is ever listed publicly.
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/trimtechbr/azure-estate/api:0.8.0
    - name: worker
      image: ghcr.io/trimtechbr/azure-estate/worker:0.8.0
    - name: webapp
      image: ghcr.io/trimtechbr/azure-estate/webapp:0.8.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/TrimTechBr/charts
  artifacthub.io/changes: |
    - kind: added
      description: An HTTPRoute alternative to the Ingress, for clusters running Gateway API. Both can be on at once, so a migration can run the two side by side while DNS moves
    - kind: fixed
      description: values.yaml uses ASCII section rules -- the box-drawing ones rendered as mojibake under helm show values on a Windows console
    - kind: added
      description: Portal 0.8.0 -- Kubernetes network topology, cluster capacity and cluster RBAC
    - kind: security
      description: All three pods now run as uid 10001 with runAsNonRoot, including the web pod, whose nginx moved to port 8080 and no longer needs root to start
    - kind: fixed
      description: The webapp pod no longer claims runAsNonRoot, which nginx cannot meet, and the API and worker pin the numeric uid the fixed images carry
    - kind: added
      description: First release of the chart, replacing the raw manifests under deploy/aks
