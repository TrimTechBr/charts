name: Charts

# Lints and renders every chart on every change, and publishes to GHCR when a
# chart's version is one the registry does not already have. Bumping the version
# in Chart.yaml is what releases; there is no separate tag to remember.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/charts.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/charts.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Charts land beside the images they install, under the same org.
  CHART_NAMESPACE: trimtechbr/charts

jobs:
  # ----------------------------------------------------------------------------
  # Lint and render. Every chart is rendered with each of its ci/*-values.yaml
  # files and the result validated against the Kubernetes schemas -- which is the
  # half `helm lint` does not do: lint parses YAML, kubeconform checks the fields
  # actually exist.
  # ----------------------------------------------------------------------------
  validate:
    name: Lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Lint
        run: |
          failed=0
          for chart in charts/*/; do
            name=$(basename "$chart")
            for values in "$chart"ci/*-values.yaml; do
              echo "::group::helm lint $name ($(basename "$values"))"
              helm lint "$chart" --values "$values" || failed=1
              echo "::endgroup::"
            done
          done
          exit $failed

      - name: Render and validate against the Kubernetes schemas
        run: |
          failed=0
          for chart in charts/*/; do
            name=$(basename "$chart")
            for values in "$chart"ci/*-values.yaml; do
              echo "::group::$name ($(basename "$values"))"
              # --strict rejects fields that are not in the schema, which is what
              # catches a typo in a field name -- the failure mode that otherwise
              # installs cleanly and does nothing.
              # The CRD catalog is what knows HTTPRoute: it is a Gateway API type rather
              # than a built-in one, and kubeconform's default schemas cover only the core
              # API. These two lines were removed once, correctly, when the charts installed
              # no custom resource at all -- and adding the first one back without them is
              # what failed this job.
              helm template "$name" "$chart" --namespace estate --values "$values" \
                | kubeconform -strict -summary -kubernetes-version 1.31.0 \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                || failed=1
              echo "::endgroup::"
            done
          done
          exit $failed

      # The guards exist to fail at render time rather than at run time. A guard
      # that stopped firing would be invisible, so each one is asserted here.
      #
      # Each case also names a phrase from the message it expects. A refusal is
      # only evidence for the guard it was written for: these lines once passed
      # --set azure.workloadIdentity.clientId, after that block had moved under
      # worker:, and every portal case was refused for the missing worker identity
      # instead -- passing, while testing nothing. $AUTH and $WI are the settings
      # every portal case needs so that only the thing it names is missing.
      - name: The refusals still refuse
        run: |
          expect_fail() {
            desc="$1"; reason="$2"; shift 2
            if out=$(helm template t "$@" 2>&1); then
              echo "::error::expected a refusal and got a render: $desc"
              return 1
            fi
            if ! printf '%s' "$out" | grep -qF -- "$reason"; then
              echo "::error::refused for another reason: $desc (expected \"$reason\")"
              printf '%s\n' "$out"
              return 1
            fi
            echo "  refused as expected: $desc"
          }
          failed=0
          P=charts/azure-estate-portal
          A=charts/azure-estate-agent
          AUTH="--set api.auth.tenantId=t --set api.auth.clientId=c"
          WI="--set worker.azure.workloadIdentity.clientId=c"
          expect_fail "portal without a database"         "A PostgreSQL connection string is required" $P $AUTH $WI || failed=1
          expect_fail "portal without api auth"           "api.auth.tenantId and api.auth.clientId are required" $P --set database.existingSecret=d $WI || failed=1
          expect_fail "portal without api client id"      "api.auth.tenantId and api.auth.clientId are required" $P --set database.existingSecret=d $WI --set api.auth.tenantId=t || failed=1
          expect_fail "portal with both identity paths"   "are both on" $P --set database.existingSecret=d $AUTH $WI --set worker.azure.clientSecret.enabled=true --set worker.azure.clientSecret.clientId=c --set worker.azure.clientSecret.value=v || failed=1
          expect_fail "portal with a second worker"       "The worker runs one replica" $P --set database.existingSecret=d $AUTH $WI --set worker.replicaCount=2 || failed=1
          expect_fail "portal with no ingress and no URL" "Nothing publishes the portal" $P --set database.existingSecret=d $AUTH $WI --set ingress.enabled=false || failed=1
          expect_fail "portal route with no gateway"      "httpRoute.parentRefs[0].name is required" $P --set database.existingSecret=d $AUTH $WI --set ingress.enabled=false --set httpRoute.enabled=true || failed=1
          expect_fail "portal add-on without a manifest URL" "has no manifestUrl" $P --set database.existingSecret=d $AUTH $WI --set addons[0].id=cmdb || failed=1
          expect_fail "portal add-on with a bad id"       "is not a valid add-on id" $P --set database.existingSecret=d $AUTH $WI --set addons[0].id=CMDB --set addons[0].manifestUrl=/addons/cmdb/manifest.json || failed=1
          expect_fail "portal with duplicate add-on ids"  "appears more than once" $P --set database.existingSecret=d $AUTH $WI --set addons[0].id=cmdb --set addons[0].manifestUrl=/a --set addons[1].id=cmdb --set addons[1].manifestUrl=/b || failed=1
          expect_fail "agent without a portal URL"        "portal.url is required" $A --set portal.clusterId=x --set portal.apiKey=k || failed=1
          expect_fail "agent without a cluster id"        "portal.clusterId is required" $A --set portal.url=https://e --set portal.apiKey=k || failed=1
          expect_fail "agent without a key"               "An agent key is required" $A --set portal.url=https://e --set portal.clusterId=x || failed=1
          # $CMDB is every setting the cmdb chart needs; each case then clears or
          # breaks exactly one (a later --set wins), so the refusal can only come
          # from the guard it names. The baseline is rendered first: if it were
          # refused itself, every case below would pass while testing nothing.
          C=charts/aep-addon-cmdb
          CMDB="--set database.existingSecret=d --set auth.tenantId=t --set auth.clientId=c --set aep.apiUrl=http://portal-api/ --set aep.scope=api://p/.default --set worker.workloadIdentity.clientId=w --set ingress.host=estate.example.com"
          helm template t $C $CMDB >/dev/null || { echo "::error::the cmdb baseline is refused, so its refusal cases prove nothing"; failed=1; }
          expect_fail "cmdb without a database"           "for the CMDB's own database is required" $C $CMDB --set database.existingSecret= || failed=1
          expect_fail "cmdb without auth"                 "auth.tenantId and auth.clientId are required" $C $CMDB --set auth.tenantId= --set auth.clientId= || failed=1
          expect_fail "cmdb with auth cleared to null"    "auth.tenantId and auth.clientId are required" $C $CMDB --set auth=null || failed=1
          expect_fail "cmdb with database cleared to null" "for the CMDB's own database is required" $C $CMDB --set database=null || failed=1
          expect_fail "cmdb with aep cleared to null"     "aep.apiUrl must be the absolute http(s) URL" $C $CMDB --set aep=null || failed=1
          expect_fail "cmdb without the portal API URL"   "aep.apiUrl must be the absolute http(s) URL" $C $CMDB --set aep.apiUrl= || failed=1
          expect_fail "cmdb with a relative portal API URL" "aep.apiUrl must be the absolute http(s) URL" $C $CMDB --set aep.apiUrl=portal-api || failed=1
          expect_fail "cmdb without the AEP scope"        "aep.scope is required" $C $CMDB --set aep.scope= || failed=1
          expect_fail "cmdb without the worker identity"  "worker.workloadIdentity.clientId is required" $C $CMDB --set worker.workloadIdentity.clientId= || failed=1
          expect_fail "cmdb ingress without a host"       "ingress.host is required" $C $CMDB --set ingress.host= || failed=1
          expect_fail "cmdb route without a gateway"      "httpRoute.parentRefs[0].name is required" $C $CMDB --set httpRoute.enabled=true --set httpRoute.hostnames[0]=estate.example.com || failed=1
          expect_fail "cmdb route without a hostname"     "httpRoute.hostnames must name at least one hostname" $C $CMDB --set httpRoute.enabled=true --set httpRoute.parentRefs[0].name=g || failed=1
          expect_fail "cmdb with a second worker"         "The worker runs one replica" $C $CMDB --set worker.replicaCount=2 || failed=1
          expect_fail "cmdb with an autoscaled worker"    "The worker cannot be autoscaled" $C $CMDB --set worker.autoscaling.enabled=true || failed=1
          expect_fail "cmdb on the portal's API path"     "pathPrefix \"/api/cmdb\" cannot be used" $C $CMDB --set pathPrefix=/api/cmdb || failed=1
          expect_fail "cmdb with a trailing slash"        "pathPrefix \"/addons/cmdb/\" cannot be used" $C $CMDB --set pathPrefix=/addons/cmdb/ || failed=1
          exit $failed

  # ----------------------------------------------------------------------------
  # Publish. Only from main, and only a version the registry does not have:
  # re-pushing an existing chart version would change what someone already
  # installed under that number.
  # ----------------------------------------------------------------------------
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write
      # Keyless signing: the certificate is issued against this workflow's
      # identity, so there is no key to store or rotate.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      # Pinned by SHA, not by tag. cosign-installer publishes no floating v4, and a
      # signing tool is the last action to let float anyway.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Twice, because the two tools read different files. `helm registry login`
      # writes Helm's own registry config; cosign reads ~/.docker/config.json, and
      # without this it cannot even pull the manifest it is about to sign.
      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Log in to GHCR (docker, for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, push and sign
        run: |
          pushed=0
          for chart in charts/*/; do
            name=$(helm show chart "$chart" | awk '/^name:/ {print $2}')
            version=$(helm show chart "$chart" | awk '/^version:/ {print $2}')
            ref="$REGISTRY/$CHART_NAMESPACE/$name:$version"

            if helm show chart "oci://$REGISTRY/$CHART_NAMESPACE/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version is already published -- bump the version in Chart.yaml to release."
              continue
            fi

            echo "::group::publishing $name $version"
            helm package "$chart" --destination dist
            # The digest is what cosign signs; a tag can be moved, a digest cannot.
            digest=$(helm push "dist/$name-$version.tgz" "oci://$REGISTRY/$CHART_NAMESPACE" 2>&1 \
              | awk '/Digest:/ {print $2}')
            cosign sign --yes "$REGISTRY/$CHART_NAMESPACE/$name@$digest"
            echo "signed $ref@$digest"
            echo "::endgroup::"
            pushed=1
          done

          if [ "$pushed" = "0" ]; then
            echo "Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
